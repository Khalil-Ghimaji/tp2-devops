# SLO dispo 99.5 % => budget d'erreur = 0.005 ; fenêtre 30 j.
# Burn rate 14.4 : 2 % du budget en 1 h  (0.02 * 720 h / 1 h  = 14.4)
# Burn rate 6    : 5 % du budget en 6 h  (0.05 * 720 h / 6 h  = 6)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: payment-api-slo, namespace: observability }
spec:
  groups:
    - name: payment-api-sli
      rules:
        - { record: "sli:error_ratio:rate5m",  expr: 'sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health",status=~"5.."}[5m]))  / sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health"}[5m]))' }
        - { record: "sli:error_ratio:rate30m", expr: 'sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health",status=~"5.."}[30m])) / sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health"}[30m]))' }
        - { record: "sli:error_ratio:rate1h",  expr: 'sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health",status=~"5.."}[1h]))  / sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health"}[1h]))' }
        - { record: "sli:error_ratio:rate6h",  expr: 'sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health",status=~"5.."}[6h]))  / sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health"}[6h]))' }
        - { record: "sli:error_ratio:rate30d", expr: 'sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health",status=~"5.."}[30d])) / sum(rate(http_requests_total{app="payment-api",path!~"/metrics|/health"}[30d]))' }
        - { record: "sli:latency_under_200ms:ratio_rate5m", expr: 'sum(rate(http_request_duration_seconds_bucket{app="payment-api",path!~"/metrics|/health",le="0.2"}[5m])) / sum(rate(http_request_duration_seconds_count{app="payment-api",path!~"/metrics|/health"}[5m]))' }
        - { record: "slo:error_budget_remaining:ratio", expr: 'clamp_min(1 - (sli:error_ratio:rate30d / 0.005), 0)' }
    - name: payment-api-burn-rate
      rules:
        - alert: ErrorBudgetBurnCritical
          expr: sli:error_ratio:rate1h > (14.4 * 0.005) and sli:error_ratio:rate5m > (14.4 * 0.005)
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "payment-api consomme 2 % du budget d'erreur en 1 h (burn rate >= 14.4)"
        - alert: ErrorBudgetBurnWarning
          expr: sli:error_ratio:rate6h > (6 * 0.005) and sli:error_ratio:rate30m > (6 * 0.005)
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "payment-api consomme 5 % du budget d'erreur en 6 h (burn rate >= 6)"
        - alert: LatencySLOViolation
          expr: sli:latency_under_200ms:ratio_rate5m < 0.95
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Moins de 95 % des requêtes < 200 ms (p95 > 200 ms)"
