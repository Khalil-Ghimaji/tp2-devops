# Déployé via : helm install otel-collector open-telemetry/opentelemetry-collector -n observability -f this.yaml
mode: deployment
image: { repository: otel/opentelemetry-collector-contrib }
config:
  receivers:
    otlp: { protocols: { http: { endpoint: 0.0.0.0:4318 }, grpc: { endpoint: 0.0.0.0:4317 } } }
  processors:
    batch: {}
  exporters:
    otlp/tempo: { endpoint: "tempo.observability:4317", tls: { insecure: true } }
  service:
    pipelines:
      traces: { receivers: [otlp], processors: [batch], exporters: [otlp/tempo] }
