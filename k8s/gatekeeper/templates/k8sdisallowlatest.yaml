apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatest
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatest
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatest

        pod_spec = s { input.review.kind.kind == "Pod"; s := input.review.object.spec }
        pod_spec = s { input.review.kind.kind != "Pod"; s := input.review.object.spec.template.spec }

        containers[c] { c := pod_spec.containers[_] }
        containers[c] { c := pod_spec.initContainers[_] }

        last_segment(image) = seg { parts := split(image, "/"); seg := parts[count(parts) - 1] }
        has_tag(image) { contains(last_segment(image), ":") }
        has_tag(image) { contains(image, "@sha256:") }

        violation[{"msg": msg}] {
          c := containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("le conteneur <%v> utilise le tag interdit ':latest' (%v)", [c.name, c.image])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not has_tag(c.image)
          msg := sprintf("le conteneur <%v> n'a pas de tag explicite (latest implicite) : %v", [c.name, c.image])
        }
