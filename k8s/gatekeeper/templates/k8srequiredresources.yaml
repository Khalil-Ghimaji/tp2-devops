apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredresources
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredresources

        pod_spec = s { input.review.kind.kind == "Pod"; s := input.review.object.spec }
        pod_spec = s { input.review.kind.kind != "Pod"; s := input.review.object.spec.template.spec }

        containers[c] { c := pod_spec.containers[_] }
        containers[c] { c := pod_spec.initContainers[_] }

        missing(c, kind, res) { not c.resources[kind][res] }

        violation[{"msg": msg}] {
          c := containers[_]
          kind := ["requests", "limits"][_]
          res := ["cpu", "memory"][_]
          missing(c, kind, res)
          msg := sprintf("le conteneur <%v> doit définir resources.%v.%v", [c.name, kind, res])
        }
